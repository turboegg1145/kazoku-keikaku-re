name: iOS

on:
  push:
    paths:
      - "rust/**"
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 准备日文字体
        working-directory: ios/kznApp
        run: |
          # 仓库里不放字体（版权/体积）。CI 临时拉一份 Noto Sans JP 打进包里；
          # 拉不到也不要紧，App 会退回去用 iOS 自带的 Hiragino。
          if [ ! -f NotoSansCJKjp-Regular.otf ] && [ ! -f NotoSansCJK-Regular.ttc ]; then
            curl -L --fail --retry 3 -o NotoSansCJKjp-Regular.otf \
              https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf \
              || echo '字体下载失败，改用系统字体'
          fi
          ls -la | head

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 编译引擎（静态库）
        run: |
          cargo build --release --target aarch64-apple-ios --manifest-path rust/Cargo.toml
          ls -l rust/target/aarch64-apple-ios/release/libkzn.a
          nm -g rust/target/aarch64-apple-ios/release/libkzn.a 2>/dev/null | grep -E 'kv_open|kzn_frame' | head

      - name: 安装 XcodeGen
        run: |
          # 钉死 2.42.0：更新的版本会写 Xcode 16 的工程格式（objectVersion 77），
          # runner 上的 Xcode 15.4 打不开。2.42.0 写 56，两边都认。
          curl -L --fail --retry 3 -o /tmp/xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
          unzip -q -o /tmp/xcodegen.zip -d /tmp/xcg
          echo "/tmp/xcg/xcodegen/bin" >> "$GITHUB_PATH"
          /tmp/xcg/xcodegen/bin/xcodegen --version

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 构建 App（不签名）
        working-directory: ios
        run: |
          xcodebuild -project Kzn.xcodeproj -scheme Kzn -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: 打包 ipa（TrollStore 用）
        working-directory: ios
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/Kzn.app out/Payload/
          ls -l out/Payload/Kzn.app/Kzn
          # 探针：可执行文件里不能出现 libkzn.dylib 的引用。
          # 出现了就说明链的是动态库（ipa 里没这个文件，真机启动必闪退）。
          if strings out/Payload/Kzn.app/Kzn | grep -q 'libkzn\.dylib'; then
            echo "错误：App 引用了 libkzn.dylib，静态库没链进去"
            exit 1
          fi
          echo "静态链接 OK"
          cd out && zip -qry Kzn.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Kzn-ipa
          path: ios/out/Kzn.ipa