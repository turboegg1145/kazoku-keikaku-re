[package]
name = "kzn"
version = "0.1.0"
edition = "2021"
description = "家族計画 ～追憶～ (GDT / Ikura GDL) 引擎的 Rust 重写"
license = "MIT OR Apache-2.0"

[lib]
name = "kzn"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
png = "0.18"
encoding_rs = "0.8"
sha2 = "0.10"
fontdue = "0.9"
lewton = "0.10.2"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
