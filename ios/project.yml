name: Kzn
options:
  bundleIdPrefix: com.kazoku
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: NO

targets:
  Kzn:
    type: application
    platform: iOS
    sources:
      - path: kznApp
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kazoku.kzn
        INFOPLIST_FILE: kznApp/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: kznApp/kzn-Bridging-Header.h
        # 必须显式指到 .a 并且 force_load：
        # 1) 只用 -lkzn 的话，目录里同时有 .dylib 时会优先用 dylib；
        # 2) 静态库里的 `#[no_mangle]` 符号（kzn_frame 等）没有别的引用，
        #    不加 force_load 会被 -dead_strip 丢掉。
        OTHER_LDFLAGS:
          - $(inherited)
          - -Wl,-force_load,$(SRCROOT)/../rust/target/aarch64-apple-ios/release/libkzn.a
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: AVFoundation.framework